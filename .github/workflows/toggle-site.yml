name: 🔴 Apagar / 🟢 Prender Website

on:
  workflow_dispatch:
    inputs:
      accion:
        description: '¿Qué quieres hacer?'
        required: true
        type: choice
        options:
          - 🟢 PRENDER el website
          - 🔴 APAGAR el website

permissions:
  pages: write
  contents: write
  id-token: write

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🟢 PRENDER — Restaurar index.html
        if: ${{ inputs.accion == '🟢 PRENDER el website' }}
        run: |
          if [ -f index.html.off ]; then
            mv index.html.off index.html
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add index.html index.html.off 2>/dev/null || true
            git rm --cached index.html.off 2>/dev/null || true
            git commit -m "🟢 Website PRENDIDO"
            git push
            echo "✅ Website prendido correctamente."
          else
            echo "⚠️ El website ya está prendido."
          fi

      - name: 🔴 APAGAR — Reemplazar con página offline
        if: ${{ inputs.accion == '🔴 APAGAR el website' }}
        run: |
          if [ -f index.html ]; then
            mv index.html index.html.off
            cat > index.html << 'OFFLINE'
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac Digitali</title>
  <style>
    body { background: #0a0a0a; color: #fff; font-family: 'Arial', sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; text-align: center; }
    h1 { font-size: 48px; color: #cc0000; letter-spacing: 4px; }
    p  { color: rgba(255,255,255,0.4); font-size: 16px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div>
    <h1>🚨</h1>
    <h1>MAC DIGITALI</h1>
    <p>SITIO TEMPORALMENTE FUERA DE LÍNEA</p>
  </div>
</body>
</html>
OFFLINE
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add index.html index.html.off
            git commit -m "🔴 Website APAGADO"
            git push
            echo "✅ Website apagado correctamente."
          else
            echo "⚠️ El website ya está apagado."
          fi
