<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac Digitali — QR Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Bebas Neue', sans-serif;
    }

    .card {
      background: #0a0a0a;
      border: 4px solid #cc0000;
      padding: 50px 60px 40px;
      text-align: center;
      max-width: 520px;
      width: 90vw;
      box-shadow: 0 0 60px rgba(204,0,0,0.3), 0 0 120px rgba(204,0,0,0.1);
      position: relative;
    }

    .card::before, .card::after {
      content: '🚨';
      position: absolute;
      font-size: 24px;
      top: 12px;
    }
    .card::before { left: 16px; }
    .card::after  { right: 16px; }

    .title {
      font-size: clamp(42px, 10vw, 72px);
      color: #fff;
      letter-spacing: 4px;
      line-height: 0.9;
      text-shadow: 3px 3px 0 #cc0000;
      margin-bottom: 6px;
    }

    .subtitle {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(11px, 2.5vw, 15px);
      color: rgba(255,255,255,0.45);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    .qr-wrap {
      background: #fff;
      display: inline-block;
      padding: 18px;
      border: 6px solid #fff;
      box-shadow: 0 0 0 3px #cc0000;
      margin-bottom: 28px;
    }

    #qrcode canvas, #qrcode img {
      display: block;
    }

    .scan-text {
      font-size: clamp(18px, 4vw, 26px);
      color: #FFD700;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .url-text {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(10px, 2vw, 13px);
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
      word-break: break-all;
    }

    .tape {
      width: 100%;
      height: 30px;
      background: repeating-linear-gradient(
        -45deg,
        #FFD700 0px, #FFD700 14px,
        #1a1a00 14px, #1a1a00 28px
      );
      margin: 28px 0 0;
      opacity: 0.6;
    }

    /* Print styles */
    @media print {
      body { background: #fff; }
      .card {
        background: #fff;
        border-color: #cc0000;
        box-shadow: none;
        max-width: 100%;
        width: 100%;
        border-width: 6px;
      }
      .title { color: #000; text-shadow: 2px 2px 0 #cc0000; }
      .subtitle { color: #555; }
      .scan-text { color: #cc0000; }
      .url-text { color: #888; }
      .card::before, .card::after { display: none; }
      .tape { display: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">MAC<br>DIGITALI</div>
    <div class="subtitle">El Hall of Shame Oficial de La Vaada Mac</div>

    <div class="qr-wrap">
      <div id="qrcode"></div>
    </div>

    <div class="scan-text">ESCANEA PARA ENTRAR</div>
    <div class="url-text">tommyhanono.github.io/Burla-Mac-Digitali</div>

    <div class="tape"></div>
  </div>

  <script>
    new QRCode(document.getElementById('qrcode'), {
      text: 'https://tommyhanono.github.io/Burla-Mac-Digitali/',
      width: 280,
      height: 280,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
